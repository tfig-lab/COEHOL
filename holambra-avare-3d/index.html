<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important} body{margin:0} :root{color-scheme:light}
/* edição de câmeras */
.cedit{margin:4px 0 6px}
.ce-tools{margin:6px 14px 4px;display:grid;gap:8px}
.ce-sum{font-size:12.5px;color:var(--muted);line-height:1.5}
.ce-sum b{color:var(--fg)}
.ce-sum i,.item .st,.ce-st::before{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--d);margin:0 4px 0 6px;vertical-align:middle}
.item.cam{position:relative;padding-right:30px}
.item .st{position:absolute;right:12px;top:50%;margin:-4px 0 0}
.ce-btns{display:flex;gap:6px;flex-wrap:wrap}
.ce-btns .t{padding:6px 10px}
.ce-info{margin:0;font-size:12px;color:var(--muted);line-height:1.45}
.ced{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.ced fieldset{border:0;margin:0;padding:0;display:grid;gap:8px;min-width:0}
.ced label{display:grid;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);min-width:0}
.ced input,.ced select,.ced textarea{font:13.5px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:6px 8px;width:100%;box-sizing:border-box;min-width:0}
.ced textarea{resize:vertical}
.ced-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ced-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--fg);margin-top:4px}
.ced-pick{font:600 12px var(--f-body);letter-spacing:0;text-transform:none;background:none;border:1px solid var(--c-cam);color:var(--c-cam);border-radius:999px;padding:4px 10px;cursor:pointer}
.ced-pick.on{background:var(--c-cam);color:#fff}
.ced-nudge{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.ced-nudge button{font:600 12px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:3px;padding:4px 8px;cursor:pointer;min-width:30px}
.ced-nudge span{font-size:11.5px;color:var(--muted);margin-left:4px}
.ced-aim{margin:0;font-size:12px;color:var(--muted)}
.ced-act{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.ced-danger{color:#D0353F!important}
.ced fieldset[disabled]{opacity:.6}
.ce-meta{margin:8px 0 0;font-size:11.5px;color:var(--muted)}
.ce-ro{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
.ce-ro p{margin:6px 0 0}
.ce-st{font-weight:700;font-size:12px}
.ce-st::before{content:"";margin-left:0}
.ce-tip{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:6;background:var(--c-cam);color:#fff;font:600 13px var(--f-body);padding:8px 14px;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:min(560px,calc(100% - 32px));text-align:center}
</style>
<title>Holambra Unidade Avaré 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas, collapsible inventory rail at left, floating detail card */
:root{
  --bg:#eef1f5; --panel:#fffffff2; --fg:#0c233c; --muted:#5b6b7f; --line:#d5dce5;
  --accent:#00338d; --accent-soft:#e6edf8;
  --c-ent:#005eb8; --c-rec:#00a3a1; --c-arm:#00338d; --c-exp:#483698; --c-cam:#0091da;
  --f-display:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1a2e; --panel:#10233df2; --fg:#e8eef6; --muted:#9aabc0; --line:#24395a; --accent:#4f9cff; --accent-soft:#16325a;
  --c-ent:#3d8fe0; --c-rec:#2cc4c1; --c-arm:#5b7fd6; --c-exp:#8a78d6; --c-cam:#33b5f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1a2e; --panel:#10233df2; --fg:#e8eef6; --muted:#9aabc0; --line:#24395a; --accent:#4f9cff; --accent-soft:#16325a;
  --c-ent:#3d8fe0; --c-rec:#2cc4c1; --c-arm:#5b7fd6; --c-exp:#8a78d6; --c-cam:#33b5f0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
#app{position:relative;height:100%}
#scene{position:absolute;inset:0}
#scene canvas{display:block;outline:none;touch-action:none}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-100%);font:600 12px var(--f-body);background:var(--panel);
  color:var(--fg);padding:3px 8px;border-radius:2px;border-left:3px solid var(--cc);white-space:nowrap;
  box-shadow:0 1px 2px #0c233c26;transition:opacity .15s}
.lbl.dim{opacity:.3}
.lbl.cam{border:0;background:var(--c-cam);color:#fff;font:600 10px/1 var(--f-mono);padding:3px 5px;border-radius:2px;transform:translate(-50%,-140%)}
.lbl.cam.on{outline:2px solid #fff;transform:translate(-50%,-140%) scale(1.25)}
.camlayer[hidden]{display:none}
.tabs{display:flex;gap:4px;padding:0 10px 6px;border-bottom:1px solid var(--line);position:sticky;top:-6px;background:var(--panel);z-index:1;padding-top:4px}
.tabs button{flex:1 1 auto;font:600 11.5px var(--f-body);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:6px 4px;cursor:pointer}
.tabs button.min{flex:0 0 28px;font:600 18px/1 var(--f-body);color:var(--muted);border:1px solid var(--line);border-radius:2px;margin:2px 0 4px 2px;padding:0}
.tabs button.min:hover{color:var(--fg);border-color:var(--accent)}
#panelOpen{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:64px;z-index:2}
#panelOpen[hidden]{display:none}
@media (max-width:760px){#panelOpen{top:auto;bottom:max(16px,env(safe-area-inset-bottom,0px))}}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.camsum{display:flex;align-items:baseline;gap:8px;margin:12px 14px 2px}
.camsum b{font:700 34px/1 var(--f-display);color:var(--c-cam)}
.camsum span{font-size:13px;color:var(--muted)}
.camtog{margin:8px 14px 2px;display:flex;align-items:center;gap:8px;font-size:13px}
.item .n{display:inline-block;min-width:44px;font:500 11px var(--f-mono);color:var(--c-cam)}
.item.cam{padding-left:14px;font-size:13px;line-height:1.3}
h3 .ct{margin-left:auto;font:500 11px var(--f-mono);letter-spacing:0;color:var(--muted)}
.lbl.ctx{font-weight:500;color:var(--muted);border-left-color:var(--muted);box-shadow:none}
header{position:absolute;top:0;left:0;right:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;z-index:3}
header > *{pointer-events:auto}
.brand{display:flex;flex-direction:column;background:var(--panel);padding:8px 14px;border-radius:2px;border:1px solid var(--line)}
.brand b{font:700 19px/1.1 var(--f-display);letter-spacing:0;color:var(--accent)}
.brand span{font:12px var(--f-body);color:var(--muted)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
button.t{font:600 12px var(--f-body);background:var(--panel);color:var(--fg);border:1px solid var(--line);
  padding:7px 11px;border-radius:2px;cursor:pointer}
button.t[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
aside{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:64px;max-height:calc(100% - 80px);width:250px;
  background:var(--panel);border:1px solid var(--line);border-radius:2px;overflow:auto;padding:6px 0 10px;z-index:2;
  transition:transform .25s ease, opacity .25s ease}
aside.closed{transform:translateX(calc(-100% - 24px));opacity:0;pointer-events:none}
aside h3{font:700 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  margin:12px 14px 4px;display:flex;align-items:center;gap:7px}
aside h3 i{width:9px;height:9px;border-radius:2px;background:var(--cc)}
.item{display:block;width:100%;text-align:left;font:14px var(--f-body);background:none;border:0;color:var(--fg);
  padding:5px 14px 5px 30px;cursor:pointer}
.item:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.item.on{background:color-mix(in srgb,var(--accent) 18%,transparent);font-weight:600}
#card.wide{width:400px}
#card{max-height:calc(100% - 100px);overflow:auto}
#card ul.ve{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45}
#card ul.ve li{margin-bottom:3px}
#card .ganho{margin-top:10px;padding:9px 11px;border-radius:2px;font-size:13.5px;line-height:1.45;background:var(--accent-soft);border-left:3px solid var(--accent)}
#card .ganho b{display:block;font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
#card p.nomes{font-size:13px;color:var(--muted)}
.enav{display:flex;gap:6px;margin-top:14px}
.enav .primary{flex:1}
button.t.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.telas{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.telas.one{grid-template-columns:1fr}
.tela{display:flex;flex-direction:column;gap:4px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font:500 12px var(--f-body)}
.tela img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block;background:#0b1422}
.tela:hover img{outline:2px solid var(--accent)}
.telas-h{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:14px}
.etapa{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.etapa .n{font:500 12px var(--f-mono);color:var(--accent);min-width:22px}
.etapa .k{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.etapa:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.etapa.on{background:color-mix(in srgb,var(--accent) 18%,transparent)}
.subtela{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);font:13px var(--f-body);padding:3px 14px 3px 44px;cursor:pointer}
.subtela:hover{color:var(--fg)}
#lightbox{position:fixed;inset:0;z-index:20;background:rgba(6,10,16,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lightbox[hidden],#card[hidden]{display:none}
#lightbox img{max-width:min(96vw,1600px);max-height:calc(100% - 90px);border-radius:2px;box-shadow:0 10px 40px #0008}
#lightbox .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;color:#e6edf3;font:14px var(--f-body)}
#lightbox .bar b{font:700 18px var(--f-display);letter-spacing:.02em}
#lightbox .bar .c{font:12px var(--f-mono);color:#9fb0c2}
#lightbox button,#lightbox a{font:600 13px var(--f-body);color:#e6edf3;background:#1c2836;border:1px solid #33465c;border-radius:2px;padding:7px 12px;cursor:pointer;text-decoration:none}
#lightbox a{background:#1f5f7a;border-color:#2c7a9a}
#card{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:300px;background:var(--panel);
  border:1px solid var(--line);border-top:4px solid var(--cc,var(--accent));border-radius:2px;padding:14px 16px;z-index:2}
#card .cat{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--cc)}
#card h2{font:700 24px/1.15 var(--f-display);color:var(--fg);margin:2px 0 8px;text-wrap:balance}
#card p{font-size:14px;line-height:1.45;margin:0 0 10px}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:13px}
#card dt{color:var(--muted)} #card dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#card .x{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
.tag{display:inline-block;font:600 11px var(--f-body);padding:2px 7px;border-radius:2px;margin-top:10px;
  background:color-mix(in srgb,var(--c-rec) 20%,transparent)}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font:12px var(--f-body);color:var(--muted);
  background:var(--panel);padding:5px 10px;border-radius:2px;border:1px solid var(--line);white-space:nowrap}
@media (max-width:760px){
  aside{top:auto;bottom:0;left:0;right:0;width:auto;max-height:45%;border-radius:2px 6px 0 0;
    padding-bottom:env(safe-area-inset-bottom,0px)}
  aside.closed{transform:translateY(110%)}
  #card{left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto}
  .hint{display:none}
  .tools{margin-left:0}
}
.legend{display:flex;gap:10px;flex-wrap:wrap;font:12px var(--f-body);color:var(--muted);margin:12px 14px 0;padding-top:10px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:14px;height:5px;border-radius:2px;background:var(--sw)}

.navpad{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 8px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.navpad button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);font:700 16px/1 Arial,sans-serif;cursor:pointer;display:grid;place-items:center;padding:0}
.navpad button:hover{border-color:var(--accent);color:var(--accent)}
.navpad span{width:1px;height:22px;background:var(--line);margin:0 4px}
.hint{display:none!important}
#card{bottom:74px!important}
#bNext{display:none!important}
.navpad .np-et{width:auto;min-width:52px;border-radius:999px;padding:0 12px;font:700 13px var(--f-body);white-space:nowrap}
#card{max-height:calc(100% - 160px)!important}
.navpad .np-next{width:auto;border-radius:999px;padding:0 16px;font:700 13px var(--f-body);background:var(--accent);border-color:var(--accent);color:#fff;white-space:nowrap}
.navpad .np-next:hover{filter:brightness(1.1);color:#fff}
@media (max-width:760px){.navpad{flex-wrap:wrap;justify-content:center;max-width:calc(100% - 24px);border-radius:16px}}

</style>

</head>
<body>
<div id="app">
  <div id="scene"></div>
  <div class="labels" id="labels"></div>
  <header>
    
    <div class="tools">
      <button class="t" id="bList" aria-pressed="true" aria-controls="list">Infraestruturas</button>
      <button class="t" id="bCams" aria-pressed="false">Câmeras</button>
      <button class="t" id="bLabels" aria-pressed="true">Rótulos</button>
      <button class="t" id="bTop">Vista de topo</button>
      <button class="t" id="bPersp">Perspectiva</button>
      <button class="t primary" id="bNext">Próxima etapa ›</button>
    </div>
  </header>
  <aside id="list"></aside>
  <button class="t" id="panelOpen" hidden aria-label="Abrir painel">› Painel</button>
  <div id="card" hidden></div>
  <div id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Tela do COE"></div>
  <div class="hint">Arrastar: girar · Botão direito ou Shift + arrastar: mover para os lados · Setas do teclado: mover · Roda: zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// Referência: vista aérea original, 1 px ≈ 1 m (estimado). Close-ups usados para refinar formas.
const W = 1275, H = 297;
const P = (x, y) => [x - W/2, y - H/2];
const V = (x, y, h=0) => { const [a,b]=P(x,y); return new THREE.Vector3(a,h,b); };

const CATS = {
  ent: {name:"Entrada e controle",           v:"--c-ent"},
  rec: {name:"Recebimento e beneficiamento", v:"--c-rec"},
  arm: {name:"Armazenagem",                  v:"--c-arm"},
  exp: {name:"Expedição",                    v:"--c-exp"},
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- renderer / câmera ----------
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setClearColor(0x000000,0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 1, 9000);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI/2.08;
controls.minDistance = 15; controls.maxDistance = 2600;
controls.screenSpacePanning = false;
controls.panSpeed = 1.2; controls.keyPanSpeed = 25;
controls.listenToKeyEvents(window);
addEventListener("keydown",e=>{ if(e.key==="Shift") controls.mouseButtons.LEFT = THREE.MOUSE.PAN; });
addEventListener("keyup",e=>{ if(e.key==="Shift") controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE; });
const BOUND = {x:1300, z:700};
controls.addEventListener("change",()=>{
  const t=controls.target, cx=THREE.MathUtils.clamp(t.x,-BOUND.x,BOUND.x), cz=THREE.MathUtils.clamp(t.z,-BOUND.z,BOUND.z);
  if(cx!==t.x||cz!==t.z){ camera.position.x+=cx-t.x; camera.position.z+=cz-t.z; t.x=cx; t.z=cz; }
});

scene.add(new THREE.HemisphereLight(0xffffff, 0xaeb7c2, .9));
const sun = new THREE.DirectionalLight(0xfff6e8, .78);
sun.position.set(-320, 520, 260); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0004;
Object.assign(sun.shadow.camera, {left:-760,right:760,top:330,bottom:-330,far:1700});
scene.add(sun);
function setSky(){ const dark=matchMedia("(prefers-color-scheme: dark)").matches&&document.documentElement.dataset.theme!=="light"||document.documentElement.dataset.theme==="dark";
  scene.background=null; scene.fog=null; }
setSky();

// ---------- texturas procedurais ----------
function canvasTex(w,h,draw){
  const c=document.createElement("canvas"); c.width=w; c.height=h; draw(c.getContext("2d"),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t;
}
const TX = {
  corr: canvasTex(64,8,(g,w,h)=>{ for(let x=0;x<w;x++){const v=200+40*Math.cos(x/w*Math.PI*2*4);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,0,1,h);} }),
  corrH: canvasTex(8,64,(g,w,h)=>{ for(let y=0;y<h;y++){const v=200+40*Math.cos(y/h*Math.PI*2*4);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(0,y,w,1);} }),
  silo: canvasTex(64,64,(g,w,h)=>{ g.fillStyle="#e6e6e6";g.fillRect(0,0,w,h);
    g.fillStyle="#cfcfcf"; for(let y=0;y<h;y+=4)g.fillRect(0,y,w,1);
    g.fillStyle="#9a9a9a"; g.fillRect(0,0,3,h); }),
  windows: canvasTex(64,64,(g,w,h)=>{ g.fillStyle="#ececec";g.fillRect(0,0,w,h);
    g.fillStyle="#3c4a55"; g.fillRect(14,22,36,20); g.fillStyle="#d4d4d4"; g.fillRect(0,56,w,8); }),
  louver: canvasTex(64,64,(g,w,h)=>{ g.fillStyle="#d8d8d8";g.fillRect(0,0,w,h);
    g.fillStyle="#5a5f62"; for(let y=4;y<h;y+=8)g.fillRect(8,y,48,4); }),
  asphalt: canvasTex(128,128,(g,w,h)=>{ g.fillStyle="#5d6266";g.fillRect(0,0,w,h);

function boxUV(geo,w,h,d,period=3){

function gable(g,ms,x1,y1,x2,y2,wallH,roofH,opt={}){
  const [a,b]=P(x1,y1),[c,d]=P(x2,y2), cx=(a+c)/2, cz=(b+d)/2, alongX=(c-a)>=(d-b);
  const L=alongX?c-a:d-b, S=alongX?d-b:c-a, ov=opt.overhang??1;
  const sub=new THREE.Group(); sub.position.set(cx,0,cz); if(alongX) sub.rotation.y=Math.PI/2; g.add(sub);
  box(sub,opt.wallMat||ms.wall,0,wallH/2,0,S,wallH,L);
  const hw=S/2+ov, sl=Math.hypot(hw,roofH+ov*roofH/(S/2)), ang=Math.atan2(roofH,S/2);
  [-1,1].forEach(sd=>{
    const geo=planeUV(new THREE.PlaneGeometry(sl,L+ov*2),sl,L+ov*2,1.2,40);
    const p=new THREE.Mesh(geo,ms.roof); p.rotation.set(-Math.PI/2,sd*ang,0);
    p.position.set(sd*hw/2,wallH+roofH/2-ov*roofH/S,0); add(sub,p);
  });

  const sh=new THREE.Shape(); sh.moveTo(-S/2,0); sh.lineTo(S/2,0); sh.lineTo(0,roofH); sh.lineTo(-S/2,0);
  [-1,1].forEach(e=>{ const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),ms.solid); m.position.set(0,wallH,e*L/2);

function ribbon(pts,w,mat,y,opt={}){
  const curve=new THREE.CatmullRomCurve3(pts.map(([x,yy])=>V(x,yy,y)),false,"catmullrom",.3);
  const n=Math.max(2,Math.ceil(curve.getLength()/2)); const pos=[],uv=[],idx=[];
  let acc=0, prev=null;
  for(let i=0;i<=n;i++){
    const p=curve.getPointAt(i/n), t=curve.getTangentAt(i/n); const nx=-t.z, nz=t.x;
    if(prev)acc+=p.distanceTo(prev); prev=p;
    const ww=typeof w==="function"?w(i/n):w, per=opt.period||(typeof w==="function"?10:w);
    pos.push(p.x+nx*ww/2,y,p.z+nz*ww/2, p.x-nx*ww/2,y,p.z-nz*ww/2); uv.push(0,acc/per, 1,acc/per);
    if(i<n){const k=i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2);}
  }
  const geo=new THREE.BufferGeometry(); geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute("uv",new THREE.Float32BufferAttribute(uv,2)); geo.setIndex(idx); geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,mat); mesh.receiveShadow=true; scene.add(mesh); return {mesh,curve};
}

(function clean(){
  const kids=scene.children.slice();
  kids.slice(_T0,_T1).concat(kids.slice(_V0,_V1),kids.slice(_R0,_R1)).forEach(o=>o.visible=false);
  const ROAD={asph:0x97a1ac, grav:0xc9cfd6, lane:0xb3bac3, shoulder:0xc6cdd4, bed:0xb3b9c0, rail:0x6b737c};
  RM.asph.color.setHex(ROAD.asph); RM.grav.color.setHex(ROAD.grav); RM.lane.color.setHex(ROAD.lane); SHOULDER.color.setHex(ROAD.shoulder);
  RM.bed.color.setHex(ROAD.bed); RM.rail.color.setHex(ROAD.rail); RM.dash.color.setHex(0xffffff);
  SHARED.conc.color.setHex(0xe4e7ea); SHARED.steel.color.setHex(0xa7afb8); SHARED.white.color.setHex(0xf7f8f9);
  SHARED.black.color.setHex(0x4a525b); SHARED.glass.color.setHex(0x8fa3b5); SHARED.door.color.setHex(0x7d8893);
  const edgeMat=new THREE.LineBasicMaterial({color:0x2b3a4a,transparent:true,opacity:.22});
  const seen=new Set();
  scene.traverse(o=>{
    if(!o.isMesh||!o.visible) return;
    const ms=Array.isArray(o.material)?o.material:[o.material];
    ms.forEach(m=>{ if(m&&m.map&&!seen.has(m)){ seen.add(m); if(m.map===TX.asphalt){m.color.setHex(ROAD.asph);} m.map=null; m.needsUpdate=true; } });
    if(o.isInstancedMesh||o.material.isMeshBasicMaterial||o.geometry.type==="PlaneGeometry"&&o.rotation.x!==0) return;
    if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
    if(o.geometry.boundingSphere.radius<2.2) return;
    o.add(new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry,30),edgeMat));
  });
  // sombra suave sobre fundo transparente
  const sc=new THREE.Mesh(new THREE.PlaneGeometry(5000,3000),new THREE.ShadowMaterial({opacity:.13}));
  sc.rotation.x=-Math.PI/2; sc.position.y=.01; sc.receiveShadow=true; scene.add(sc);
})();

    q("#ed-reset").onclick=()=>{ draft=null; placingWhat=null; hint();
      if(c.isNew&&!docs[c.id]){ c.deleted=true; dropCam(c); makeCam(c); c.lbl.style.display="none"; rebuildMarkers(); relist(); }
      else if(c.isNew) store(c.id,Object.assign({},docs[c.id],{isNew:true,deleted:true}));
      else if(c.edited) unstore(c.id);
      else store(c.id,Object.assign({},c.orig,{deleted:true,status:"validar",obs:""}));
      selectCam(null); };
  }
  // dica de posicionamento
  const tip=document.createElement("div"); tip.className="ce-tip"; tip.hidden=true; document.getElementById("app").appendChild(tip);
  function hint(){ tip.hidden=!placingWhat; tip.textContent=placingWhat==="new"?"Clique no mapa onde a nova câmera será instalada. Esc para cancelar.":placingWhat==="p"?"Clique no mapa onde a câmera será instalada. Em uma estrutura, ela fica fixada na superfície.":placingWhat==="t"?"Clique no ponto que a câmera deve enxergar.":""; }
  addEventListener("keydown",e=>{ if(e.key==="Escape"&&placingWhat){ if(placingWhat==="new"){ adding=false; const bt=document.getElementById("ceAdd"); bt.classList.remove("primary"); bt.textContent="+ Nova câmera"; } placingWhat=null; hint(); document.querySelectorAll("[data-pick]").forEach(x=>x.classList.remove("on")); } });
  const ground=new THREE.Plane(new THREE.Vector3(0,1,0),0), tmp=new THREE.Vector3();
  function place(e){
    if(!draft&&placingWhat!=="new") { placingWhat=null; hint(); return; }
    const r=renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(Object.values(groups),true); let pt=null, onStruct=false;
    if(hits.length){ pt=hits[0].point.clone(); onStruct=pt.y>.6; } else if(ray.ray.intersectPlane(ground,tmp)) pt=tmp.clone();
    if(!pt) return; const [mx,my]=W2M(pt);
    if(placingWhat==="new"){ placingWhat=null; hint(); createAt(mx,my,+(pt.y+.4).toFixed(1),onStruct); return; }
    if(placingWhat==="p"){ const dx=mx-draft.p[0], dy=my-draft.p[1]; draft.p[0]=mx; draft.p[1]=my;
      if(onStruct){ draft.p[2]=+(pt.y+.4).toFixed(1); draft.pole=false; } draft.t[0]+=dx; draft.t[1]+=dy; syncInst(); }
    else { draft.t=[mx,my,+Math.max(0,pt.y).toFixed(1)]; }
    placingWhat=null; hint(); document.querySelectorAll("[data-pick]").forEach(x=>x.classList.remove("on")); syncInputs(); preview();
  }
  // arrastar a câmera no mapa (modo de edição)
  let drag=null; const dragPlane=new THREE.Plane(), dp=new THREE.Vector3();
  function camUnder(e){ if(!EDIT||!camOn||!canWrite||mode==="pending") return null;
    const r=renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mouse,camera);
    const hits=ray.intersectObjects(CAMS.filter(c=>!c.deleted&&c.g).map(c=>c.g),true);
    for(const h of hits){ let o=h.object; while(o&&!o.userData.id) o=o.parent; if(o){ const c=CAMS[+o.userData.id.slice(4)]; if(c&&!c.deleted) return c; } } return null; }
  host.addEventListener("pointerdown",e=>{ if(e.button!==0||placingWhat) return; const c=camUnder(e); if(!c) return;
    const i=CAMS.indexOf(c); if(!draft||draft.id!==c.id){ selectCam(i,false); }
    if(!draft||draft.id!==c.id) return;
    controls.enabled=false; dragPlane.set(new THREE.Vector3(0,1,0),-c.pos.y);
    ray.ray.intersectPlane(dragPlane,dp); const [mx,my]=W2M(dp);
    drag={id:c.id,ox:draft.p[0]-mx,oy:draft.p[1]-my,moved:false,pid:e.pointerId}; renderer.domElement.style.cursor="grabbing"; e.preventDefault(); },true);
  addEventListener("pointermove",e=>{
    if(!drag){ if(EDIT&&!e.buttons&&!placingWhat&&camUnder(e)) renderer.domElement.style.cursor="move"; return; }
    const r=renderer.domElement.getBoundingClientRect(); mouse.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1); ray.setFromCamera(mouse,camera);
    if(!ray.ray.intersectPlane(dragPlane,dp)) return; const [mx,my]=W2M(dp);
    const nx=+(mx+drag.ox).toFixed(1), ny=+(my+drag.oy).toFixed(1), dx=nx-draft.p[0], dy=ny-draft.p[1]; if(!dx&&!dy) return;
    draft.p[0]=nx; draft.p[1]=ny; draft.t[0]=+(draft.t[0]+dx).toFixed(1); draft.t[1]=+(draft.t[1]+dy).toFixed(1); drag.moved=true; syncInputs(); preview(); });
  addEventListener("pointerup",()=>{ if(!drag) return; drag=null; controls.enabled=true; renderer.domElement.style.cursor="move"; });
  // nova câmera no centro da vista
  let adding=false;
  document.getElementById("ceAdd").onclick=()=>{
    if(!canWrite){ setInfo("Seu acesso a este painel é apenas de leitura."); return; }
    if(mode==="pending"){ setInfo("Aguarde a conexão com o painel."); return; }
    adding=!adding; placingWhat=adding?"new":null; hint();
    document.getElementById("ceAdd").classList.toggle("primary",adding); document.getElementById("ceAdd").textContent=adding?"Cancelar nova câmera":"+ Nova câmera";
    if(adding&&selCam!==null) selectCam(null);
  };
  function createAt(mx,my,h,onStruct){
    adding=false; const bt=document.getElementById("ceAdd"); bt.classList.remove("primary"); bt.textContent="+ Nova câmera";
    const near=CAMS.filter(c=>!c.deleted).sort((a,b)=>Math.hypot(a.p[0]-mx,a.p[1]-my)-Math.hypot(b.p[0]-mx,b.p[1]-my))[0];
    const id="n"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    const f={a:near?near.a:"rec",d:"Nova câmera",p:[mx,my,onStruct?h:7],t:[mx+15,my,0],pole:!onStruct,status:"validar",obs:"",isNew:true,deleted:false};
    const c=newCam(id,f); c.status="validar"; c.edited=false; rebuildMarkers(); relist();
    draft=null; selectCam(CAMS.indexOf(c),false); if(draft) draft.dirty=true;
    setInfo("Câmera criada. Ajuste a direção e clique em Salvar.");
  }
  // exportação
  document.getElementById("ceExp").onclick=()=>{
    const rows=[["Código","Área","Descrição","Instalação","Situação","X (m)","Y (m)","Altura (m)","Alvo X (m)","Alvo Y (m)","Alvo altura (m)","Direção (°)","Inclinação (°)","Observações","Alterada","Última alteração"]];
    CAMS.filter(c=>!c.deleted).forEach(c=>{ const dx=c.t[0]-c.p[0], dy=c.t[1]-c.p[1], dist=Math.hypot(dx,dy);
      rows.push([c.code,(CAM_AREAS.find(a=>a.id===c.a)||{}).name,c.d,c.p[2]<0?"Subterrânea":c.pole?"Poste":"Estrutura",ST[c.status||"validar"][0],c.p[0],c.p[1],c.p[2],c.t[0],c.t[1],c.t[2],
        Math.round((Math.atan2(dx,-dy)*180/Math.PI+360)%360),Math.round(Math.atan2(c.t[2]-c.p[2],dist)*180/Math.PI),c.obs||"",c.edited?"Sim":"Não",c.at?new Date(c.at).toLocaleString("pt-BR"):""]); });
    CAMS.filter(c=>c.deleted&&!c.isNew).forEach(c=>rows.push([c.code,(CAM_AREAS.find(a=>a.id===c.a)||{}).name,c.d,"","Removida","","","","","","","","",c.obs||"","Sim",c.at?new Date(c.at).toLocaleString("pt-BR"):""]));
    const csv="﻿"+rows.map(r=>r.map(v=>{ const s=String(v==null?"":v).replace(/\./g,typeof v==="number"?",":"."); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(";")).join("\r\n");
    const fn="cameras-avare-"+new Date().toISOString().slice(0,10)+".csv";
    if(mode==="shared") toParent({type:"download",filename:fn,data:csv});
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"})); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); }
  };
  window.CAMEDIT={ dragging:()=>!!drag, card, placing:()=>EDIT&&!!placingWhat, place,
    tag:c=>c.edited?(c.status==="ok"?"Posição validada pelo time":"Posição ajustada pelo time"):"Posição revisada pelo time em 03/11/2026" };
  // ao trocar de câmera, descarta rascunho não salvo
  const _sel=selectCam;
})();
</script>
